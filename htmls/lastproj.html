<!DOCTYPE html>
<html lang="en" style="color-scheme: light dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="./../css/lastproj.css">
  <script src="./../script.js" defer></script>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <div class="game">
    <img class="display" src="./../images/rock_hand_shake.gif" alt="rock">
    <img class="display" src="./../images/robot_rock_hand_shake.gif" alt="rockc">
  </div>
  <div class="wrapper">
    <div class="options">
      <div class="option" style="background-image: url(./../images/paper.png);"></div>
      <div class="option active" style="background-image: url(./../images/rock.png);"></div>
      <div class="option" style="background-image: url(./../images/scissors.png);"></div>
    </div>
  </div>
  <div class="result"></div>
</body>
</html>
